name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # so the release workflow can gate on this exact job

permissions:
  contents: read

jobs:
  test:
    # Pinned, not ubuntu-latest: on ubuntu-26.04 the KiCad 10 PPA publishes only an
    # amd64v3 index, so `apt-get install kicad` falls back to Ubuntu's KiCad 9 and
    # every test that loads a KiCad 10 file fails. Move this with the PPA.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ERC/DRC tests shell out to kicad-cli, so the real thing has to be here.
      # kicad-footprints too: ERC's footprint_link_issues check reports every
      # footprint whose library the host cannot see, and the draft tests assert
      # violation-free reports — without the stock footprint libraries those
      # assertions fail on environment, not code (symbols are vendored per
      # project, so kicad-symbols stays unnecessary).
      - name: Install KiCad
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad kicad-footprints
          kicad-cli --version
          # The suite needs KiCad 10; fail here, by name, rather than as dozens of
          # "Failed to load" test errors if the runner or PPA drifts again.
          kicad-cli --version | grep -q '^10\.' || { echo "expected KiCad 10, got $(kicad-cli --version)" >&2; exit 1; }
          # Installing the libraries is not enough: kicad-cli resolves footprint
          # links through the user's global fp-lib-table and never creates the
          # default one headlessly, so a fresh runner still reports every stock
          # library as "not included in the configuration". Seed the default
          # table from KiCad's own template. The global sym-lib-table is left
          # absent on purpose: symbols are vendored per project, kicad-symbols
          # is not installed, and a table naming missing files would only add
          # noise.
          KICAD_VER="$(kicad-cli --version | cut -d. -f1,2)"
          mkdir -p "$HOME/.config/kicad/$KICAD_VER"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/$KICAD_VER/"

      - run: npm ci
      - run: npm run lint:md
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Golden-corpus renders (task 9.5): the suite above fails on any pin
      # violation; this renders every pinned sheet to SVG so a reviewer can
      # eyeball layout changes from the run page without a checkout.
      - name: Render golden corpus
        run: bash scripts/render-goldens.sh golden-renders
      - name: Upload golden renders
        uses: actions/upload-artifact@v4
        with:
          name: golden-renders
          path: golden-renders/
      # The published tarball is what users get; make sure it still packs.
      - run: npm pack --dry-run
